name: Agent Gateway

on:
  push:
    branches: [dev, main]
    paths:
      - "crates/agent-tools/**"
      - "crates/td-audit/**"
      - "src/mcp/**"
      - "src/bin/agent_gateway.rs"
      - "src/startup.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile.agent-gateway"
      - ".github/workflows/agent-gateway.yml"
  pull_request:
    branches: [dev, main]
    paths:
      - "crates/agent-tools/**"
      - "crates/td-audit/**"
      - "src/mcp/**"
      - "src/bin/agent_gateway.rs"
      - "src/startup.rs"
      - "Dockerfile.agent-gateway"
      - ".github/workflows/agent-gateway.yml"

jobs:
  # Fast, DB-less checks: the pure crate + that the standalone binary compiles.
  test:
    name: Test crate + build binary
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: true
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y protobuf-compiler
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Unit-test the pure agent-tools crate (no DB/cloud)
        run: cargo test -p agent-tools --verbose
      - name: Build the agent-gateway binary (offline)
        run: cargo build --bin agent-gateway --verbose

  # Build + push the standalone image on push to dev/main (not PRs).
  docker:
    name: Build & push image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set image tag
        id: tags
        run: echo "tags=trydirect/agent-gateway:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.agent-gateway
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

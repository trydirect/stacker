name: Agent Gateway

on:
  workflow_dispatch: {}
  push:
    branches: [dev, main, feature/agent-gateway]
    paths:
      - "crates/agent-tools/**"
      - "crates/td-audit/**"
      - "src/mcp/**"
      - "src/bin/agent_gateway.rs"
      - "src/startup.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile.agent-gateway"
      - ".github/workflows/agent-gateway.yml"
  pull_request:
    branches: [dev, main]
    paths:
      - "crates/agent-tools/**"
      - "crates/td-audit/**"
      - "src/mcp/**"
      - "src/bin/agent_gateway.rs"
      - "src/startup.rs"
      - "Dockerfile.agent-gateway"
      - ".github/workflows/agent-gateway.yml"

jobs:
  # Fast, DB-less checks + build the release binary once (cached), so the Docker
  # image just bakes it (no Rust compile inside Docker).
  build:
    name: Test crate + build release binary
    # Pinned to 22.04 (glibc 2.35) so the binary runs on the debian:bookworm-slim
    # runtime (glibc 2.36). ubuntu-latest (24.04, glibc 2.39) would require a
    # newer glibc than the runtime has -> "GLIBC_2.38 not found".
    runs-on: ubuntu-22.04
    env:
      SQLX_OFFLINE: true
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y protobuf-compiler
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Unit-test the pure agent-tools crate (no DB/cloud)
        run: cargo test -p agent-tools --verbose
      - name: Build the agent-gateway binary (release, offline)
        run: cargo build --release --bin agent-gateway --verbose
      - name: Upload binary for the Docker job
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: agent-gateway-bin
          path: target/release/agent-gateway
          retention-days: 1

  # Bake the prebuilt binary into a slim runtime image and push (push only).
  docker:
    name: Build & push image
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download prebuilt binary
        uses: actions/download-artifact@v4
        with:
          name: agent-gateway-bin
          path: .
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set image tag
        id: tags
        # Sanitize the ref for a valid Docker tag (feature/x -> feature-x).
        run: |
          TAG="$(echo "${{ github.ref_name }}" | tr '/' '-')"
          echo "tags=trydirect/agent-gateway:${TAG}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.agent-gateway
          push: true
          tags: ${{ steps.tags.outputs.tags }}

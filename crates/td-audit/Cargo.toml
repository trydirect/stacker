[package]
name = "td-audit"
version = "0.1.0"
edition = "2021"
description = "Pure-logic audit engines for TryDirect public checkers (compose, dockerfile, image, cost, exposure, readiness). No web/DB dependencies."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
thiserror = "1"
async-trait = "0.1"
semver = "1"

[features]
default = []
# Placeholder for a future browser build of the paste-only checkers.
wasm = []

[dev-dependencies]
cucumber = "0.22"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# BDD acceptance tests (Gherkin), matching the workspace convention.
[[test]]
name = "bdd"
harness = false
